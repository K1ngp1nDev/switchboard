<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090a" />
    <meta
      name="description"
      content="SWITCHBOARD — a control room for AI agent workflows. Deterministic event-sourced runs, live token streams, trace waterfalls, human approval gates and full replay. Frontend-only demo, synthetic data."
    />
    <title>SWITCHBOARD — AI agent control room</title>
    <link rel="preload" href="/fonts/CabinetGrotesk-800.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeneralSans-500.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Critical shell: dark first paint, DOM-text LCP before any JS. */
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #08090a; color: #e9eaee; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #boot h1 { font-size: 15px; letter-spacing: 0.34em; font-weight: 700; margin: 0; }
      #boot h1 em { color: #ffb224; font-style: normal; }
      #boot p { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #969ba8; margin: 0; }
      #boot .bar { width: 120px; height: 2px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
      #boot .bar i { display: block; width: 40%; height: 100%; background: #ffb224; border-radius: 2px; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <h1><em>◆</em>&nbsp;SWITCHBOARD</h1>
        <p>AI agent control room</p>
        <div class="bar"><i></i></div>
      </div>
    </div>
  </body>
</html>
